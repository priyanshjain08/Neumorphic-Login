<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
color-scheme:light;--bg:#e4eaec;--hi:#fff;--lo:#b9c4ca;--txt:#2b3035;--mut:#7d8890;--blue:#1a73e8;--grad:linear-gradient(90deg,#12d8fa,#0a78e8)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);font-family:Poppins,system-ui,sans-serif;color:var(--txt);display:flex;align-items:center;justify-content:center;overflow:hidden}
.orb{position:fixed;border-radius:50%;background:var(--bg);box-shadow:12px 12px 24px var(--lo),-12px -12px 24px var(--hi)}
.o1{width:220px;height:220px;top:6%;left:5%}.o2{width:60px;height:60px;top:18%;right:12%}.o3{width:150px;height:150px;bottom:8%;right:6%}
.card{position:relative;z-index:1;width:min(380px,92vw);background:var(--bg);border-radius:30px;box-shadow:20px 20px 40px var(--lo),-20px -20px 40px var(--hi);padding:40px 30px 36px;display:flex;flex-direction:column;align-items:center;text-align:center;animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.97)}}
.icon{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;box-shadow:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);margin-bottom:22px}
.icon svg{width:36px;height:36px;fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .7s .5s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
h1{font-size:30px;font-weight:700}
.msg{font-size:17px;font-weight:600;margin:14px 0 6px}
.sub{font-size:14px;color:var(--mut);margin-bottom:30px}
.btn{position:relative;overflow:hidden;width:100%;height:56px;border:0;border-radius:16px;background:var(--bg);color:var(--blue);font:700 14px Poppins,sans-serif;letter-spacing:.5px;cursor:pointer;box-shadow:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);transition:color .3s,box-shadow .3s}
.btn::before{content:"";position:absolute;inset:0;background:var(--grad);transform:translateY(101%);transition:transform .45s ease}
.btn span{position:relative}
.btn:hover{color:#fff;box-shadow:0 10px 22px rgba(10,120,232,.35)}
.btn:hover::before{transform:translateY(0)}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<main class="card">
  <div class="icon"><svg viewBox="0 0 24 24"><path d="M4 12.500l5 5L20 6.500"/></svg></div>
  <h1>Welcome</h1>
  <p class="msg">You are logged in !</p>
  <p class="sub">Let's get to work</p>
  <button class="btn"><span>GET STARTED</span></button>
</main>
</body>
</html>
