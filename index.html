<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neumorphic Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
color-scheme:light;--bg:#e4eaec;--hi:#fff;--lo:#b9c4ca;--txt:#2b3035;--mut:#7d8890;--blue:#1a73e8;--grad:linear-gradient(90deg,#12d8fa,#0a78e8)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);font-family:Poppins,system-ui,sans-serif;color:var(--txt);display:flex;align-items:center;justify-content:center;overflow:hidden}
.orb{position:fixed;border-radius:50%;background:var(--bg);box-shadow:12px 12px 24px var(--lo),-12px -12px 24px var(--hi)}
.o1{width:220px;height:220px;top:6%;left:5%}.o2{width:60px;height:60px;top:18%;right:12%}.o3{width:150px;height:150px;bottom:8%;right:6%}
.scene{perspective:1200px;width:min(380px,92vw);height:640px;position:relative;z-index:1}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,.2,.2,1)}
.scene.flipped .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--bg);border-radius:30px;
box-shadow:20px 20px 40px var(--lo),-20px -20px 40px var(--hi);padding:34px 30px;display:flex;flex-direction:column;align-items:center}
.back{transform:rotateY(180deg)}
.icon{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;box-shadow:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);margin-bottom:18px}
.icon svg{width:26px;height:26px;fill:var(--blue)}
h1{font-size:28px;font-weight:700}
.sub{font-size:13px;color:var(--mut);margin:8px 0 26px}
.field{position:relative;width:100%;height:56px;margin-bottom:20px;border-radius:16px;box-shadow:inset 5px 5px 10px var(--lo),inset -5px -5px 10px var(--hi)}
.field::before{content:"";position:absolute;inset:0;border-radius:16px;padding:2px;opacity:0;pointer-events:none;
background:conic-gradient(from var(--a),transparent 0 70%,#12d8fa 90%,#0a78e8 100%);
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.field:focus-within::before{opacity:1;animation:spin 1.6s linear infinite}
@keyframes spin{to{--a:360deg}}
.field input{width:100%;height:100%;border:0;outline:0;background:transparent;border-radius:16px;padding:14px 46px 0 18px;font:500 15px Poppins,sans-serif;color:var(--txt)}
.field label{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--mut);pointer-events:none;transition:.2s}
.field input:focus+label,.field input:not(:placeholder-shown)+label{top:12px;font-size:10px;transform:none}
.eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:var(--mut);display:grid}
.eye svg{width:22px;height:22px;fill:currentColor}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:13px;margin:-2px 0 22px;color:var(--mut)}
.row label{display:flex;align-items:center;gap:8px;cursor:pointer}
.row a{color:var(--blue);text-decoration:none;font-weight:500}
.btn{position:relative;overflow:hidden;width:100%;height:56px;border:0;border-radius:16px;background:var(--bg);color:var(--blue);font:700 14px Poppins,sans-serif;letter-spacing:.5px;cursor:pointer;
box-shadow:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);transition:color .3s,box-shadow .3s}
.btn::before{content:"";position:absolute;inset:0;background:var(--grad);transform:translateY(101%);transition:transform .45s ease;z-index:0}
.btn span{position:relative;z-index:1}
.btn:hover{color:#fff;box-shadow:0 10px 22px rgba(10,120,232,.35)}
.btn:hover::before{transform:translateY(0)}
.switch{display:flex;align-items:center;gap:14px;margin-top:auto;font-size:12.5px;color:var(--mut)}
.circ{width:52px;height:52px;border-radius:50%;border:0;background:var(--bg);color:var(--blue);display:grid;place-items:center;cursor:pointer;box-shadow:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);transition:box-shadow .2s}
.circ:active{box-shadow:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi)}
.circ svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.back .field{margin-bottom:16px}.back .sub{margin-bottom:22px}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<div class="scene" id="scene"><div class="flip">

<form class="face front" id="loginForm" novalidate autocomplete="on">
  <div class="icon"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9z"/></svg></div>
  <h1>Welcome</h1><p class="sub">Login to continue your journey</p>
  <div class="field"><input type="email" id="le" placeholder=" " autocomplete="email"><label for="le">Email Address</label></div>
  <div class="field"><input type="password" id="lp" placeholder=" "><label for="lp">Password</label>
    <button type="button" class="eye" data-t="lp" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.300-3.100 11-7c-1.700-3.900-6-7-11-7zm0 11.500a4.500 4.500 0 1 1 0-9 4.500 4.500 0 0 1 0 9zm0-7a2.500 2.500 0 1 0 0 5 2.500 2.500 0 0 0 0-5z"/></svg></button></div>
  <div class="row"><label><input type="checkbox"> Remember me</label><a href="#">Forgot Password?</a></div>
  <button class="btn"><span>Login</span></button>
  <div class="switch">Don't have an account?
    <button type="button" class="circ" data-flip aria-label="Create account"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
</form>

<form class="face back" onsubmit="return false">
  <div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4.500"/><path d="M3.500 21c0-4 3.800-6.500 8.500-6.500s8.500 2.500 8.500 6.500z"/></svg></div>
  <h1>Create Account</h1><p class="sub">Start your journey with us</p>
  <div class="field"><input type="text" placeholder=" " id="sn"><label for="sn">Full Name</label></div>
  <div class="field"><input type="email" placeholder=" " id="se"><label for="se">Email Address</label></div>
  <div class="field"><input type="password" placeholder=" " id="sp"><label for="sp">Password</label>
    <button type="button" class="eye" data-t="sp" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.300-3.100 11-7c-1.700-3.900-6-7-11-7zm0 11.500a4.500 4.500 0 1 1 0-9 4.500 4.500 0 0 1 0 9zm0-7a2.500 2.500 0 1 0 0 5 2.500 2.500 0 0 0 0-5z"/></svg></button></div>
  <div class="field"><input type="password" placeholder=" " id="sc"><label for="sc">Confirm Password</label></div>
  <button class="btn"><span>CREATE ACCOUNT</span></button>
  <div class="switch">Already have an account?
    <button type="button" class="circ" data-flip aria-label="Back to login"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button></div>
</form>

</div></div>

<script>
// ===== CHANGE YOUR LOGIN DETAILS HERE =====
const ALLOWED_EMAIL='priyanshjain08.offical@gmail.com';
const ALLOWED_PASSWORD='pj_08';
// ===========================================
document.getElementById('loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  const email=document.getElementById('le').value.trim();
  const pass=document.getElementById('lp').value;
  if(email===ALLOWED_EMAIL && pass===ALLOWED_PASSWORD){
    window.location.href='welcome.html';   // <-- change this file name/path if needed
  }else{alert('Incorrect email or password');}
});
const scene=document.getElementById('scene');
document.querySelectorAll('[data-flip]').forEach(b=>b.onclick=()=>scene.classList.toggle('flipped'));
document.querySelectorAll('.eye').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.t);i.type=i.type==='password'?'text':'password'});
</script>
</body>
</html>
